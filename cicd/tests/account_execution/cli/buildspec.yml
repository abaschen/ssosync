version: 0.2

env:
  secrets-manager:
    SCIMAccessToken: ssosync-staging/aws/SCIMAccessToken
    SSOSyncGoogleCredentials: ssosync-staging/google/ServiceAccountCredentials
  parameter-store:
    SCIMEndpointUrl: /SSOSync-Staging/aws/SCIMEndpointUrl
    IdentityStoreID: /SSOSync-Staging/aws/IdentityStoreId
    GoogleAdminEmail: /SSOSync-Staging/google/AdminEmail
    Region: /SSOSync-Staging/aws/SSORegion

  variables:
    ExpectedExitState: 0

phases:
  pre_build:
    commands:
      # Print all environment variables (handy for AWS CodeBuild logs)
      - env

  build:
    commands:
      - export SSOSYNC_BIN=$([ "$(uname -m)" = "aarch64" ] && echo "./dist/ssosync_linux_arm64_v8.2/ssosync" || echo "./dist/ssosync_linux_amd64_v1/ssosync")
      - $SSOSYNC_BIN --version
      - cat $SSOSyncGoogleCredentials > credentials.json
      - cat credentials.json

      - $SSOSYNC_BIN -t "${SCIMAccessToken}" -e "${SCIMEndpointUrl}" -u "${GoogleAdminEmail}" -i "${IdentityStoreID}" -r "${Region}" -s "groups" -g "name:AWS*"; ExitState=$?

      - |
        if expr "${ExitState}" : "${ExpectedExitState}" >/dev/null; then
          echo "We got what we expected"
          exit 0
        else
          echo "We didn't get what we expected"
          exit 1
        fi
